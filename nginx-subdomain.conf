# HTTP：两个域名都只做 ACME 验证 + 全量跳 HTTPS
server {
    listen 80;
    server_name xunxinli.com survey.xunxinli.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS：寻心理官网（根域名）
server {
    listen 443 ssl;
    server_name xunxinli.com;

    ssl_certificate     /etc/letsencrypt/live/xunxinli.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xunxinli.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# HTTPS：问卷分支（独立子域 survey.xunxinli.com）
server {
    listen 443 ssl;
    server_name survey.xunxinli.com;

    ssl_certificate     /etc/letsencrypt/live/xunxinli.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xunxinli.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/survey;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 微信授权域名校验文件（网页授权域名 = survey.xunxinli.com）
    location ~ ^/MP_verify_[A-Za-z0-9]+\.txt$ {
        root /usr/share/nginx/survey;
    }

    # 后端 API（问卷作答 / 微信授权）
    location /api/ {
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
