server {
    listen 80;
    server_name xunxinli.com;

    # ACME HTTP-01 验证
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其余 80 流量全部跳 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name xunxinli.com;

    ssl_certificate     /etc/letsencrypt/live/xunxinli.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xunxinli.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 官网：站点根目录
    root /usr/share/nginx/html;

    # 问卷分支：/survey
    location /survey {
        alias /usr/share/nginx/html/survey;
        index index.html;
        try_files $uri $uri/ /survey/index.html;
    }

    # 根路径默认走官网 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API（问卷与官网共用）
    location /api/ {
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
