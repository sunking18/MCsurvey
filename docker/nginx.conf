# ========== HTTPS：寻心理测评平台 q.xunxinli.com ==========
server {
    listen 443 ssl;
    server_name q.xunxinli.com;

    ssl_certificate     /etc/letsencrypt/live/xunxinli.com-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xunxinli.com-0001/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://172.17.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location = /MP_verify_b1s8XUY2r8hgdUhB.txt {
        default_type text/plain;
        return 200 "b1s8XUY2r8hgdUhB";
    }

    location = /MP_verify_5M84aFdnbDnQAOic.txt {
        default_type text/plain;
        return 200 "5M84aFdnbDnQAOic";
    }
}
