# 问卷系统 Nginx 配置
# - 前端静态文件由 Nginx 直接托管（更快）
# - /api/* 反代到 Node.js 后端（容器名 app:3000）
# - HTTPS 由 certbot 自动配置后生效

server {
    listen 80;
    server_name xunxinli.com www.xunxinli.com;

    # Let's Encrypt 验证路径
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 前端静态文件
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ $uri.html =404;
    }

    # 静态资源（JS 库等）
    location /assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 30d;
    }

    # 微信校验文件
    location ~ ^/MP_verify_[A-Za-z0-9]+\.txt$ {
        root /usr/share/nginx/html;
        default_type text/plain;
    }

    # API 反代到 Node 后端
    location /api/ {
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # 日志
    access_log /var/log/nginx/survey_access.log;
    error_log /var/log/nginx/survey_error.log;
}

# HTTPS 配置（certbot 自动生成后会追加 server { listen 443 ssl ... } 段）
# 初次部署时先跑 HTTP，用 certbot 申请证书后自动补上 HTTPS
