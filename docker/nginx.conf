# ========== HTTP 80：ACME 验证 + 全量跳 HTTPS ==========
server {
    listen 80;
    server_name xunxinli.com survey.xunxinli.com q.xunxinli.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ========== HTTPS：寻心理官网 xunxinli.com ==========
server {
    listen 443 ssl;
    server_name xunxinli.com;

    ssl_certificate     /etc/letsencrypt/live/xunxinli.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xunxinli.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/website;

    location /assets/ {
        alias /usr/share/nginx/website/assets/;
        expires 30d;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/MP_verify_[A-Za-z0-9]+\.txt$ {
        root /usr/share/nginx/html;
        default_type text/plain;
    }

    location /api/ {
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    access_log /var/log/nginx/survey_access.log;
    error_log /var/log/nginx/survey_error.log;
}

