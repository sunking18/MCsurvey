<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>问卷数据管理 · 后台</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#f0f2f7; --card:#fff; --ink:#1a2332; --sub:#5c6b7f;
    --brand:#3a6ea5; --brand-soft:#e8f0fa; --green:#2d9d78; --orange:#e07a3e;
    --red:#d9543b; --border:#dde2ec; --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;}

  /* 登录页 */
  .login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
  .login-box{background:var(--card);border-radius:20px;padding:40px 36px;width:100%;max-width:420px;box-shadow:0 8px 32px rgba(30,50,80,.08);}
  .login-box h1{font-size:22px;text-align:center;margin-bottom:6px;color:var(--brand);}
  .login-box .sub{text-align:center;font-size:13px;color:var(--sub);margin-bottom:24px;}
  .login-box label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:#445;}
  .login-box input{width:100%;padding:12px 14px;border:2px solid var(--border);border-radius:10px;font-size:15px;transition:.2s;}
  .login-box input:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brand-soft);}
  .login-box button{width:100%;margin-top:16px;padding:12px;border:0;border-radius:10px;background:var(--brand);color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:.15s;}
  .login-box button:hover{background:#2f5d8f;}
  .login-box .err{margin-top:12px;padding:10px 14px;background:#fef2ef;border:1px solid #f5c4bc;border-radius:10px;color:var(--red);font-size:13px;display:none;text-align:center;}

  /* 主界面 */
  #app{display:none;padding:24px 20px 60px;max-width:1200px;margin:0 auto;}

  /* 顶栏 */
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px;}
  .topbar h1{font-size:22px;color:var(--ink);}
  .topbar .actions{display:flex;gap:10px;flex-wrap:wrap;}
  .btn-sm{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--ink);text-decoration:none;transition:.15s;}
  .btn-sm:hover{border-color:var(--brand);color:var(--brand);}
  .btn-sm.primary{background:var(--brand);color:#fff;border-color:var(--brand);}
  .btn-sm.primary:hover{background:#2f5d8f;}
  .btn-sm.danger{color:var(--red);border-color:#f5c4bc;}
  .btn-sm.danger:hover{background:#fef2ef;}

  /* 概览卡片 */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:28px;}
  .card{background:var(--card);border-radius:var(--radius);padding:20px 22px;box-shadow:0 2px 12px rgba(30,50,80,.04);border:1px solid var(--border);}
  .card .label{font-size:12.5px;color:var(--sub);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px;}
  .card .val{font-size:30px;font-weight:800;color:var(--ink);line-height:1.2;}
  .card .val.green{color:var(--green);}
  .card .val.orange{color:var(--orange);}
  .card .hint{font-size:11.5px;color:var(--sub);margin-top:4px;}

  /* 图表网格 */
  .charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:20px;margin-bottom:28px;}
  .chart-card{background:var(--card);border-radius:var(--radius);padding:22px 24px;box-shadow:0 2px 12px rgba(30,50,80,.04);border:1px solid var(--border);}
  .chart-card h3{font-size:15px;margin-bottom:4px;color:var(--ink);}
  .chart-card .desc{font-size:12px;color:var(--sub);margin-bottom:16px;}
  .chart-wrap{position:relative;height:260px;}

  /* 全宽图表 */
  .chart-full{grid-column:1/-1;}

  /* 表格 */
  .table-card{background:var(--card);border-radius:var(--radius);padding:22px 24px;box-shadow:0 2px 12px rgba(30,50,80,.04);border:1px solid var(--border);margin-bottom:28px;overflow-x:auto;}
  .table-card h3{font-size:15px;margin-bottom:16px;}
  .table-card .toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .table-card .toolbar input{padding:8px 12px;border:2px solid var(--border);border-radius:8px;font-size:13px;width:220px;outline:none;transition:.2s;}
  .table-card .toolbar input:focus{border-color:var(--brand);}
  .table-card .toolbar .hint{font-size:11.5px;color:var(--sub);margin-left:auto;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{background:var(--bg);padding:10px 12px;text-align:left;font-weight:600;color:var(--sub);border-bottom:2px solid var(--border);white-space:nowrap;}
  td{padding:9px 12px;border-bottom:1px solid #f0f2f7;white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis;}
  tr:hover td{background:#fafbfe;}

  /* 分页 */
  .pager{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:16px;flex-wrap:wrap;}
  .pager button{padding:7px 14px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--ink);font-size:13px;font-weight:600;cursor:pointer;transition:.15s;}
  .pager button:hover:not(:disabled){border-color:var(--brand);color:var(--brand);}
  .pager button:disabled{opacity:.4;cursor:not-allowed;}
  .pager .page-info{font-size:12.5px;color:var(--sub);padding:0 8px;}
  .tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11.5px;font-weight:600;}
  .tag-green{background:#eafaf2;color:#1a7a56;}
  .tag-yellow{background:#fdf6e8;color:#9a7b2a;}
  .tag-orange{background:#fbe7da;color:#a85a28;}
  .tag-red{background:#fbe6e1;color:#a83a28;}

  /* 加载态 */
  .loading{text-align:center;padding:60px 20px;color:var(--sub);font-size:14px;}
  .empty{text-align:center;padding:40px;color:var(--sub);font-size:14px;}

  /* 响应式 */
  @media(max-width:640px){
    #app{padding:16px 12px 40px;}
    .cards{grid-template-columns:repeat(2,1fr);}
    .charts{grid-template-columns:1fr;}
    .card .val{font-size:24px;}
  }
</style>
</head>
<body>

<!-- ====== 登录页 ====== -->
<div class="login-wrap" id="loginPage">
  <div class="login-box">
    <h1>📊 问卷数据管理后台</h1>
    <p class="sub">输入管理密钥后查看统计数据与导出明细</p>
    <label>管理密钥</label>
    <input type="password" id="keyInput" placeholder="请输入 EXPORT_KEY" onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">进入后台</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<!-- ====== 主界面 ====== -->
<div id="app">
  <div class="topbar">
    <h1>📊 数据概览</h1>
    <div class="actions">
      <button class="btn-sm primary" onclick="refreshData()">🔄 刷新数据</button>
      <a class="btn-sm" id="csvOptionLink" href="#" download>⬇️ 下载CSV（按选项）</a>
      <a class="btn-sm" id="csvScoreLink" href="#" download>⬇️ 下载CSV（按分值）</a>
      <a class="btn-sm" id="jsonLink" href="#" download>⬇️ 下载 JSON</a>
      <button class="btn-sm danger" onclick="doLogout()">退出登录</button>
    </div>
  </div>

  <!-- 概览卡片 -->
  <div class="cards" id="overviewCards"></div>

  <!-- 数据明细表格（分页+搜索） -->
  <div class="table-card">
    <h3>📋 数据明细</h3>
    <div class="toolbar">
      <input type="text" id="searchInput" placeholder="搜索性别/年龄/城市/姓名缩写..." onkeydown="if(event.key==='Enter')loadDataTable(1)">
      <button class="btn-sm primary" onclick="loadDataTable(1)">搜索</button>
      <span class="hint" id="tableHint"></span>
    </div>
    <div id="dataTableWrap"><div class="loading">加载中...</div></div>
    <div class="pager" id="tablePager"></div>
  </div>

  <!-- 维度分数分布 -->
  <div class="charts" id="dimCharts"></div>

  <!-- 人口统计 -->
  <div class="charts" id="demoCharts"></div>

  <!-- 每日趋势 -->
  <div class="charts">
    <div class="chart-card chart-full">
      <h3>📈 每日提交趋势</h3>
      <div class="desc">最近 30 天的问卷提交数量变化</div>
      <div class="chart-wrap"><canvas id="trendChart"></canvas></div>
    </div>
  </div>

  <!-- 每题平均分 -->
  <div class="table-card">
    <h3>📋 各题目平均得分（按维度分组）</h3>
    <div id="qTableWrap"></div>
  </div>
</div>

<script>
let API_KEY = '';
let trendChartInst = null;
const SESSION_KEY = 'admin_session';
const SESSION_DURATION = 30 * 60 * 1000; // 30分钟（毫秒）

/* ========== 登录/登出 ========== */
function doLogin(){
  const key = document.getElementById('keyInput').value.trim();
  const err = document.getElementById('loginErr');
  if(!key){ showErr(err,'请输入密钥'); return; }
  API_KEY = key;
  fetch('/api/stats?key='+encodeURIComponent(key))
    .then(r=>r.json())
    .then(j=>{
      if(!j.success){ showErr(err,j.message||'密钥错误'); return; }
      // 保存登录会话
      saveSession(key);
      document.getElementById('loginPage').style.display='none';
      document.getElementById('app').style.display='block';
      renderAll(j);
      setLinks(key);
    })
    .catch(e=>{ showErr(err,'网络错误：'+e.message); });
}

function saveSession(key){
  try {
    const session = { key, time: Date.now() };
    sessionStorage.setItem(SESSION_KEY, JSON.stringify(session));
  } catch(e) {}
}

function loadSession(){
  try {
    const raw = sessionStorage.getItem(SESSION_KEY);
    if(!raw) return null;
    const session = JSON.parse(raw);
    if(Date.now() - session.time > SESSION_DURATION){
      sessionStorage.removeItem(SESSION_KEY);
      return null;
    }
    return session.key;
  } catch(e){ return null; }
}

function clearSession(){
  try { sessionStorage.removeItem(SESSION_KEY); } catch(e) {}
}
function showErr(el,msg){ el.textContent=msg; el.style.display='block'; }
function doLogout(){
  API_KEY='';
  clearSession();
  document.getElementById('app').style.display='none';
  document.getElementById('loginPage').style.display='flex';
  document.getElementById('keyInput').value='';
}
function setLinks(k){
  document.getElementById('csvOptionLink').href='/api/export.csv?key='+encodeURIComponent(k)+'&mode=option';
  document.getElementById('csvScoreLink').href='/api/export.csv?key='+encodeURIComponent(k)+'&mode=score';
  document.getElementById('jsonLink').href='/api/export?key='+encodeURIComponent(k);
}

/* ========== 刷新 ========== */
function refreshData(){
  if(!API_KEY) return;
  fetch('/api/stats?key='+encodeURIComponent(API_KEY))
    .then(r=>r.json())
    .then(j=>{
      if(!j.success){ alert(j.message||'获取失败'); return; }
      renderAll(j);
    })
    .catch(e=>alert('刷新失败：'+e.message));
}

/* ========== 渲染全部 ========== */
function renderAll(d){
  renderOverview(d.overview);
  renderDimensions(d.dimensions);
  renderDemographics(d.demographics);
  renderTrend(d.dailyTrend);
  renderQStats(d.qStats || []);
}

/* ========== 概览卡片 ========== */
function renderOverview(o){
  const html = `
    <div class="card"><div class="label">总答题数</div><div class="val">${o.total}</div><div class="hint">累计提交</div></div>
    <div class="card"><div class="label">今日新增</div><div class="val ${o.today>0?'green':''}">${o.today}</div><div class="hint">${new Date().toLocaleDateString('zh-CN')}</div></div>
    <div class="card"><div class="label">平均答题时长</div><div class="val">${o.avgDuration}</div><div class="hint">秒 / 人</div></div>
  `;
  document.getElementById('overviewCards').innerHTML = html;
}

/* ========== 维度分数分布图 ========== */
function renderDimensions(dim){
  const wrap = document.getElementById('dimCharts');
  let html = '';
  for (const [k, d] of Object.entries(dim)){
    const dist = d.distribution || {};
    const labels = Object.keys(dist);
    const values = Object.values(dist);
    // 颜色
    const colorsMap = {
      '优秀':'#2d9d78','良好':'#5ba885','一般':'#e0a93b','不容乐观':'#d9543b',
      '不怎么焦虑':'#2d9d78','一般':'#e0a93b','较强':'#e07a3e','很强':'#d9543b',
      '需关注':'#d9543b'
    };
    const colors = labels.map(l => colorsMap[l]||'#888');

    html += `<div class="chart-card">
      <h3>${d.name}</h3>
      <div class="desc">共 ${d.count} 条 · 均分 ${d.avg}（范围 ${d.min}-${d.max}）</div>
      <div class="chart-wrap"><canvas id="chart-${k}"></canvas></div>
    </div>`;
  }
  wrap.innerHTML = html;

  // 绘制
  for (const [k, d] of Object.entries(dim)){
    const dist = d.distribution || {};
    const labels = Object.keys(dist);
    const values = Object.values(dist);
    const colorsMap = {'优秀':'#2d9d78','良好':'#5ba885','一般':'#e0a93b','不容乐观':'#d9543b','不怎么焦虑':'#2d9d78','较强':'#e07a3e','很强':'#d9543b','需关注':'#d9543b'};
    const colors = labels.map(l => colorsMap[l]||'#888');
    const ctx = document.getElementById('chart-'+k)?.getContext('2d');
    if(!ctx) continue;
    new Chart(ctx,{
      type:'bar',
      data:{labels, datasets:[{label:'人数',data:values,backgroundColor:colors,borderRadius:6}]},
      options:{
        responsive:true,maintainAspectRatio:false,
        plugins:{legend:{display:false}},
        scales:{y:{beginAtZero:true,ticks:{stepSize:1}},x:{ticks:{font:{size:11}}}}
      }
    });
  }
}

/* ========== 人口统计 ========== */
function renderDemographics(de){
  const wrap = document.getElementById('demoCharts');
  // 性别饼图 + 年龄柱状图 + 城市 TOP10
  const gender = de.gender || {};
  const age = de.age || {};
  const city = de.city || {};

  // 性别 - 水平条形图
  const gLabels = Object.keys(gender).filter(k=>k!=='未填');
  const gValues = gLabels.map(k => gender[k]);

  // 年龄 - 取前8个
  const aEntries = Object.entries(age).sort((a,b)=>b[1]-a[1]).slice(0,8);

  // 城市 TOP8
  const cEntries = Object.entries(city).sort((a,b)=>b[1]-a[1]).slice(0,8);

  wrap.innerHTML = `
    <div class="chart-card">
      <h3>👤 性别分布</h3>
      <div class="desc">共 ${gLabels.length} 类</div>
      <div class="chart-wrap"><canvas id="demoGender"></canvas></div>
    </div>
    <div class="chart-card">
      <h3>🎂 年龄分布（TOP 8）</h3>
      <div class="desc">共 ${Object.keys(age).length} 种</div>
      <div class="chart-wrap"><canvas id="demoAge"></canvas></div>
    </div>
    <div class="chart-card">
      <h3>🏙️ 所在城市（TOP 8）</h3>
      <div class="desc">共 ${Object.keys(city).length} 个城市</div>
      <div class="chart-wrap"><canvas id="demoCity"></canvas></div>
    </div>
  `;

  // 性别 - 饼图
  const gCtx = document.getElementById('demoGender')?.getContext('2d');
  if(gCtx && gLabels.length > 0){
    new Chart(gCtx,{type:'doughnut',data:{
      labels:gLabels,
      datasets:[{data:gValues,backgroundColor:['#3a6ea5','#e07a3e','#2d9d78','#e0a93b','#9b7ed9'],borderWidth:0}]
    },options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{size:11},padding:12}}}}});
  } else {
    const gWrap = document.getElementById('demoGender')?.parentElement?.querySelector('.chart-wrap');
    if (gWrap) gWrap.innerHTML = '<div class="empty">暂无数据</div>';
  }

  // 年龄 - 横向条形
  barChart('demoAge', aEntries.map(e=>e[0]), aEntries.map(e=>e[1]), '#e07a3e');
  // 城市 - 横向条形
  barChart('demoCity', cEntries.map(e=>e[0]), cEntries.map(e=>e[1]), '#3a6ea5');
}

function barChart(id, labels, values, color){
  const ctx = document.getElementById(id)?.getContext('2d');
  if(!ctx || labels.length===0){ const wrap=document.getElementById(id)?.parentElement?.querySelector('.chart-wrap'); if(wrap) wrap.innerHTML='<div class="empty">暂无数据</div>'; return; }
  new Chart(ctx,{type:'bar',data:{
    labels, datasets:[{label:'人数',data:values,backgroundColor:Array(labels.length).fill(color),borderRadius:4}]
  },options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,
    plugins:{legend:{display:false}},
    scales:{x:{beginAtZero:true,ticks:{stepSize:1}},y:{ticks:{font:{size:11}}}}
  }});
}

/* ========== 每日趋势 ========== */
function renderTrend(trend){
  const ctx = document.getElementById('trendChart')?.getContext('2d');
  if(!ctx) return;
  if(trendChartInst) trendChartInst.destroy();
  if(trend.length === 0){
    ctx.canvas.parentElement.innerHTML = '<div class="empty">暂无数据</div>';
    return;
  }
  trendChartInst = new Chart(ctx,{type:'line',data:{
    labels:trend.map(d=>d.date.slice(5)),
    datasets:[{
      label:'提交数',
      data:trend.map(d=>d.count),
      borderColor:'#3a6ea5',
      backgroundColor:'rgba(58,110,165,.08)',
      fill:true,
      tension:.35,
      pointRadius:3,
      pointHoverRadius:6
    }]
  },options:{
    responsive:true,maintainAspectRatio:false,
    plugins:{legend:{display:false}},
    scales:{y:{beginAtZero:true,ticks:{stepSize:1}},x:{ticks:{font:{size:11},maxRotation:45}}}
  }});
}

/* ========== 每题平均分表格 ========== */
function renderQStats(qs){
  const wrap = document.getElementById('qTableWrap');
  if(!qs || qs.length === 0){ wrap.innerHTML='<div class="empty">暂无答题数据</div>'; return; }

  // 按 comm / anx / res 分组
  const groups = { comm:[], anx:[], res:[] };
  qs.forEach(q => { if(groups[q.dim]!==undefined) groups[q.dim].push(q); });

  // 补充维度名
  const dimNames = { comm:'亲子沟通情况', anx:'学业焦虑', res:'心理韧性' };

  let html = '';
  for (const [k, list] of Object.entries(groups)){
    if(list.length === 0) continue;
    html += `<h4 style="margin:18px 0 10px;font-size:14px;color:var(--brand);">${dimNames[k]}</h4>`;
    html += `<table><tr><th>题号</th><th>维度</th><th>平均分</th><th>作答人数</th><th>选项分布参考</th></tr>`;
    for (const q of list){
      const avgColor = q.avg >= 4 ? 'green' : q.avg >= 3 ? '' : q.avg >= 2 ? 'orange' : 'red';
      const optsStr = (q.opts||[]).map((o,i)=>`${i+1}.${o}`).join(' / ');
      html += `<tr>
        <td>q${q.q}</td><td>${q.dim}</td><td><strong class="${avgColor}">${q.avg.toFixed(2)}</strong></td><td>${q.count}</td><td style="font-size:11.5px;color:var(--sub);max-width:300px;">${optsStr}</td>
      </tr>`;
    }
    html += `</table>`;
  }
  wrap.innerHTML = html;
}

/* ========== 自动登录（优先检查session，其次URL带key参数） ========== */
(function(){
  // 1) 先检查30分钟内的session
  const savedKey = loadSession();
  if(savedKey){
    document.getElementById('keyInput').value = savedKey;
    doLogin();
    return;
  }
  // 2) 其次检查URL参数
  const p = new URLSearchParams(location.search);
  const k = p.get('key');
  if(k){ document.getElementById('keyInput').value=k; doLogin(); }
})();

/* ========== 数据明细表格（分页+搜索） ========== */
let currentPage = 1;
const PAGE_SIZE = 20;

// 题目元信息（用于展示每题选项文本）
const Q_TEXTS = [
  {t:'我允许孩子在一些事情上和我有不同意见。',dim:'开放尊重',opts:['完全不符合','比较不符合','一般','比较符合','非常符合']},
  {t:'和孩子谈家庭规则或安排时，我会让孩子参与讨论。',dim:'规则协商',opts:['完全不符合','比较不符合','一般','比较符合','非常符合']},
  {t:'和孩子谈事情时，我会主动询问孩子的看法。',dim:'主动询问',opts:['完全不符合','比较不符合','一般','比较符合','非常符合']},
  {t:'和孩子讨论事情时，我常常坚持自己说了算。',dim:'控制式沟通',opts:['完全不符合','比较不符合','一般','比较符合','非常符合'],reverse:true},
  {t:'我鼓励孩子表达不同意见，并说明自己的理由。',dim:'开放表达',opts:['完全不符合','比较不符合','一般','比较符合','非常符合']},
  {t:'我会鼓励孩子从不同角度看问题。',dim:'引导讨论',opts:['完全不符合','比较不符合','一般','比较符合','非常符合']},

function parseAnswers(ansJson) {
  let a = {};
  try { a = JSON.parse(ansJson || '{}'); } catch (e) { a = {}; }
  const result = [];
  const keys = ['comm','anx','res'];
  for (const k of keys) {
    const arr = Array.isArray(a[k]) ? a[k] : [];
    for (let i = 0; i < arr.length; i++) {
      const v = parseInt(arr[i], 10);
      result.push((isNaN(v) || v < 1 || v > 5) ? null : v);
    }
  }
  while (result.length < 34) result.push(null);
  return result;
}

function getOptionText(qIdx, val) {
  if (val === null || val === undefined || val === '') return '';
  const q = Q_TEXTS[qIdx];
  if (!q || !q.opts) return val;
  const idx = parseInt(val, 10) - 1;
  if (idx >= 0 && idx < q.opts.length) return q.opts[idx];
  return val;
}

function formatDuration(r) {
  if (!r.start_time || !r.submit_time) return '';
  const t0 = new Date(r.start_time).getTime();
  const t1 = new Date(r.submit_time).getTime();
  if (isNaN(t0) || isNaN(t1) || t1 < t0) return '';
  return Math.round((t1 - t0) / 1000) + '秒';
}

function loadDataTable(page) {
  if (!API_KEY) return;
  currentPage = page;
  const search = document.getElementById('searchInput').value.trim();
  let url = '/api/responses?key=' + encodeURIComponent(API_KEY) + '&page=' + page + '&pageSize=' + PAGE_SIZE;
  if (search) url += '&search=' + encodeURIComponent(search);

  document.getElementById('dataTableWrap').innerHTML = '<div class="loading">加载中...</div>';
  fetch(url)
    .then(r => r.json())
    .then(j => {
      if (!j.success) { document.getElementById('dataTableWrap').innerHTML = '<div class="empty">加载失败：' + (j.message||'未知错误') + '</div>'; return; }
      renderDataTable(j.data || []);
      renderPager(j.pagination || {});
      document.getElementById('tableHint').textContent = `共 ${j.pagination.total} 条记录`;
    })
    .catch(e => { document.getElementById('dataTableWrap').innerHTML = '<div class="empty">网络错误：' + e.message + '</div>'; });
}

function renderDataTable(rows) {
  const wrap = document.getElementById('dataTableWrap');
  if (!rows.length) { wrap.innerHTML = '<div class="empty">暂无数据</div>'; return; }

  // 基础字段列
  let html = `<table>
    <tr>
      <th>ID</th><th>提交时间</th><th>答题时长</th>
      <th>性别</th><th>年龄</th><th>职业</th><th>收入</th><th>城市</th>
      <th>姓名缩写</th><th>手机后4位</th><th>子女数</th>
      <th>沟通总分</th><th>焦虑总分</th><th>韧性总分</th>
      <th>IP地址</th>`;

  // 34题列头（用题干前20字+维度）
  Q_TEXTS.forEach((q, i) => {
    const shortTitle = q.t.length > 18 ? q.t.slice(0, 18) + '…' : q.t;
    html += `<th title="${q.t}">q${i+1}<br><small style="font-weight:400;color:var(--sub);">${shortTitle}</small></th>`;
  });

  html += '</tr>';

  // 数据行
  for (const r of rows) {
    const ans = parseAnswers(r.answers);
    let scores = {};
    try { scores = JSON.parse(r.scores || '{}'); } catch(e) {}

    html += `<tr>
      <td>${r.id}</td>
      <td style="font-size:11.5px;">${(r.created_at||'').replace('T',' ').slice(0,19)}</td>
      <td>${formatDuration(r)}</td>
      <td>${r.gender||''}</td><td>${r.age||''}</td><td>${r.occupation||''}</td><td>${r.income||''}</td><td>${r.city||''}</td>
      <td>${r.name_code||''}</td><td>${r.phone_last4||''}</td><td>${r.children_count||''}</td>
      <td><strong style="color:var(--brand);">${(scores.comm&&scores.comm.total)||''}</strong></td>
      <td><strong style="color:var(--orange);">${(scores.anx&&scores.anx.total)||''}</strong></td>
      <td><strong style="color:var(--green);">${(scores.res&&scores.res.total)||''}</strong></td>
      <td style="font-size:11.5px;">${r.ip||''}</td>`;

    // 34题值：显示选项文本（鼠标悬停看分值）
    ans.forEach((v, i) => {
      const optText = getOptionText(i, v);
      const title = v !== null ? `分值: ${v}${Q_TEXTS[i].reverse ? ' (反向题)' : ''}` : '';
      html += `<td title="${title}" style="text-align:center;font-size:11.5px;${v!==null?'':'color:#ccc'}">${optText}</td>`;
    });

    html += '</tr>';
  }

  html += '</table>';
  wrap.innerHTML = html;
}

function renderPager(pg) {
  const pager = document.getElementById('tablePager');
  const { page, totalPages, total } = pg;
  if (totalPages <= 1) { pager.innerHTML = ''; return; }

  let html = '';
  // 上一页
  html += `<button onclick="loadDataTable(${page-1})" ${page<=1?'disabled':''}>◀ 上一页</button>`;
  // 页码
  const start = Math.max(1, page - 2);
  const end = Math.min(totalPages, page + 2);
  if (start > 1) html += `<button onclick="loadDataTable(1)">1</button><span class="page-info">…</span>`;
  for (let i = start; i <= end; i++) {
    html += `<button onclick="loadDataTable(${i})" ${i===page?'style="border-color:var(--brand);color:var(--brand);background:var(--brand-soft);"':''}>${i}</button>`;
  }
  if (end < totalPages) html += `<span class="page-info">…</span><button onclick="loadDataTable(${totalPages})">${totalPages}</span>`;
  // 下一页
  html += `<button onclick="loadDataTable(${page+1})" ${page>=totalPages?'disabled':''}>下一页 ▶</button>`;
  // 信息
  html += `<span class="page-info">第 ${page}/${totalPages} 页 · 共 ${total} 条</span>`;

  pager.innerHTML = html;
}

// 登录成功后自动加载表格第一页
const _origRenderAll = renderAll;
renderAll = function(d) {
  _origRenderAll(d);
  loadDataTable(1);
};
